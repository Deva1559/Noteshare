# ================================================================
# NOTESSHARE - Application Configuration
# ================================================================

spring.application.name=notesshare-backend
server.port=8080

# ----------------------------------------------------------------
# Database Configuration (MySQL)
# Default username is 'root', default password is 'root'
# You can override with system environment variables: DB_USERNAME and DB_PASSWORD
# ----------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/notesshare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------
# Hibernate / JPA
# ----------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----------------------------------------------------------------
# File Upload Configuration
# Supported formats: PDF, DOC, DOCX, PPT, PPTX, TXT
# Maximum file size: 50MB
# ----------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
file.upload-dir=uploads/notes

# ----------------------------------------------------------------
# JWT Security Configuration
# 256-bit secret key for HMAC-SHA256 (Base64 encoded)
# Expiration: 86400000 ms = 24 hours
# ----------------------------------------------------------------
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ----------------------------------------------------------------
# CORS Allowed Origins
# ----------------------------------------------------------------
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# ----------------------------------------------------------------
# OpenAPI / Swagger UI
# Access via: http://localhost:8080/swagger-ui.html
# ----------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
